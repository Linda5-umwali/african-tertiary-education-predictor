[project]
name = "african-tertiary-education-predictor"
version = "1.0.0"
description = "Predicts Gross Tertiary Education Enrollment (%) for African countries from education pipeline indicators."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "joblib==1.4.2",
    "python-multipart==0.0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"